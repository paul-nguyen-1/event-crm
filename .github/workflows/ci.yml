name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    # CI-only placeholder credentials below: they configure a throwaway
    # Postgres/RabbitMQ container that's created fresh and destroyed at the
    # end of this job. They are NEVER valid outside this workflow — do not
    # reuse any of these values as a real staging/production secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventcrm # CI-only placeholder, not a real credential
          POSTGRES_PASSWORD: eventcrm # CI-only placeholder, not a real credential
          POSTGRES_DB: eventcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eventcrm:eventcrm@localhost:5432/eventcrm_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672 # RabbitMQ's own built-in default creds, not ours
      JWT_ACCESS_SECRET: ci-access-secret # CI-only placeholder, not a real production secret
      JWT_REFRESH_SECRET: ci-refresh-secret # CI-only placeholder, not a real production secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: api
        run: npx prisma generate

      - name: Apply migrations
        working-directory: api
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Unit tests
        working-directory: api
        run: npm test

      - name: E2E tests
        working-directory: api
        run: npm run test:e2e
